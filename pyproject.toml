[tool.comfy]
PublisherId = "peter119lee"
DisplayName = "MiniMax-H3 Tools"
Icon = ""

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
