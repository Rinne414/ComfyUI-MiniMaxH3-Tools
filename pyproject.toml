[project]
name = "minimax-h3-tools"
description = "ComfyUI loaders for MiniMax-H3 NF4 weights, plus prompt, canvas, audio reroll, and AV latent tools."
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[project.optional-dependencies]
nf4 = ["bitsandbytes>=0.50.0"]

[project.urls]
Repository = "https://github.com/Rinne414/ComfyUI-MiniMaxH3-Tools"
"Bug Tracker" = "https://github.com/Rinne414/ComfyUI-MiniMaxH3-Tools/issues"
"MiniMax-H3" = "https://huggingface.co/MiniMaxAI/MiniMax-H3"

[tool.comfy]
PublisherId = "peter119lee"
DisplayName = "MiniMax-H3 Tools"
requires-comfyui = ">=0.30.0"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
