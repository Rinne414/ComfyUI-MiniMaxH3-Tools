name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 05:17 UTC: also run against ComfyUI master to catch API breaks early.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (ComfyUI ${{ matrix.comfyui }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'schedule' && '{"comfyui":["pinned","master"]}' || '{"comfyui":["pinned"]}') }}
    env:
      # v0.45.0, the first release with native MiniMax-H3-Image support (the H3-Image nodes need it)
      COMFYUI_COMMIT: 989d93d0d968e704c589ce0146bb18c77f6b50cc
      COMFYUI_PATH: ${{ github.workspace }}/../ComfyUI
      PYTHONPATH: ${{ github.workspace }}/../ComfyUI:${{ github.workspace }}

    steps:
      - name: Check out extension
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Check out ComfyUI (pinned commit or master)
        run: |
          if [ "${{ matrix.comfyui }}" = "master" ]; then
            COMFYUI_REF=master
          else
            COMFYUI_REF="$COMFYUI_COMMIT"
          fi
          git init "$COMFYUI_PATH"
          git -C "$COMFYUI_PATH" remote add origin https://github.com/Comfy-Org/ComfyUI.git
          git -C "$COMFYUI_PATH" fetch --depth=1 origin "$COMFYUI_REF"
          git -C "$COMFYUI_PATH" checkout --detach FETCH_HEAD
          if [ "${{ matrix.comfyui }}" != "master" ]; then
            test "$(git -C "$COMFYUI_PATH" rev-parse HEAD)" = "$COMFYUI_COMMIT"
          fi
          echo "Testing against ComfyUI $(git -C "$COMFYUI_PATH" rev-parse HEAD)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install -r "$COMFYUI_PATH/requirements.txt"
          python -m pip install pytest ruff

      - name: Lint and compile
        run: |
          python -m ruff check .
          python -m compileall -q .

      - name: Verify generated workflows
        run: |
          python scripts/generate_example_workflows.py
          git diff --exit-code -- example_workflows

      - name: Run tests
        run: python -m pytest tests -q

      - name: Smoke-test extension registration
        run: python scripts/smoke_registration.py
