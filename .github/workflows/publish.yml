name: Publish to ComfyUI Registry

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish to Comfy Registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out extension
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Publish custom node
        # This step receives the registry token, so it is pinned to an immutable
        # commit. The release tags 1.0.0 and 1.0.1 point to an older revision whose
        # `comfy --yes env` call current comfy-cli rejects; this is the revision of
        # the v1 branch that published 0.1.0 (uses `--skip-prompt`).
        uses: Comfy-Org/publish-node-action@0eb6cd742945443bee7f79eeddd4f732780029a1 # v1 branch head as of 2026-11-11, the revision that published 0.1.0
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Confirm the registry lists this version as latest and active
        run: python scripts/verify_registry_release.py
