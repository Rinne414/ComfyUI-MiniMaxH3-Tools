name: Publish to ComfyUI Registry

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  check-version:
    name: Check whether this version is already published
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Check out extension
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Any pyproject.toml change triggers this workflow, so a version that is
      # already on the registry is skipped here instead of failing on a duplicate.
      # An unreadable registry answer fails the job and publishes nothing.
      - name: Compare pyproject.toml with the registry
        id: decide
        run: python scripts/registry_release.py decide

  publish-node:
    name: Publish to Comfy Registry
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The action checks out the repository and installs its own Python (3.10),
      # which then stays first on PATH for the rest of this job. Nothing else runs
      # here; the registry check below has its own job and its own Python.
      - name: Publish custom node
        # This step receives the registry token, so it is pinned to an immutable
        # commit. The release tags 1.0.0 and 1.0.1 point to an older revision whose
        # `comfy --yes env` call current comfy-cli rejects; this is the revision of
        # the v1 branch that published 0.1.0 (uses `--skip-prompt`).
        uses: Comfy-Org/publish-node-action@0eb6cd742945443bee7f79eeddd4f732780029a1 # v1 branch head as of 2026-11-11, the revision that published 0.1.0
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

  verify-release:
    name: Confirm the registry lists this version as latest and active
    needs: [check-version, publish-node]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out extension
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check the registry
        run: python scripts/registry_release.py
